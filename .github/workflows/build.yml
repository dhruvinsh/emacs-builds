name: Build

# Push a tag like v31.1-1 (<emacs-version>-<package-revision>) to build,
# test and publish a GitHub release. Pushes to main and manual runs only
# build and test; artifacts are kept on the run.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      emacs_version:
        description: Emacs release to build (defaults to build.sh's EMACS_VERSION)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.ubuntu }} ${{ matrix.toolkit }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        toolkit: [gtk3, pgtk]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.emacs_version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)-([0-9]+)$ ]]; then
              echo "::error::tag must look like v31.1-1, got ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "EMACS_VERSION=${BASH_REMATCH[1]}" >>"${GITHUB_ENV}"
            echo "PKG_REVISION=${BASH_REMATCH[3]}" >>"${GITHUB_ENV}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            echo "EMACS_VERSION=${INPUT_VERSION}" >>"${GITHUB_ENV}"
          fi

      - name: Build
        run: bash build.sh "${{ matrix.toolkit }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.ubuntu }}-${{ matrix.toolkit }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0

  test:
    name: test ${{ matrix.ubuntu }} ${{ matrix.toolkit }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        toolkit: [gtk3, pgtk]
    env:
      TOOLKIT: ${{ matrix.toolkit }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.ubuntu }}-${{ matrix.toolkit }}
          path: dist

      - name: Install and smoke-test
        run: bash test/test.sh dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          # GitHub rewrites "~" in asset names to "."; rename first so
          # SHA256SUMS matches the files people actually download.
          for f in *~*.deb; do mv -- "${f}" "${f//\~/.}"; done
          sha256sum -- *.deb >SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          cat >notes.md <<EOF
          GNU Emacs ${version%-*} for Ubuntu (amd64), native-compiled (AOT).

          | Package | Session |
          | --- | --- |
          | \`emacs-wayland\` | Wayland (pure GTK) |
          | \`emacs-x11\` | Xorg (GTK3) |

          Install the file matching your Ubuntu release:

              sudo apt install ./emacs-wayland_${version}.ubuntu26.04_amd64.deb
          EOF
          gh release create "${GITHUB_REF_NAME}" ./*.deb SHA256SUMS \
            --title "Emacs ${version}" --notes-file notes.md
